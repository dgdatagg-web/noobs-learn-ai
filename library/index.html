nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:14px 32px;display:flex;justify-content:space-between;align-items:center;background:rgba(11,15,26,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06);}

.hero p{font-size:16px;color:rgba(180,195,215,.78);max-width:560px;margin:0 auto;line-height:1.7;}

/* Category sections */
.category-section{max-width:1100px;margin:0 auto;padding:0 24px 48px;}
.category-header{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.category-header h2{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:800;letter-spacing:-1px;}
.category-badge{padding:4px 10px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:1px;}
.badge-hard{background:rgba(34,211,238,.1);color:#22d3ee;border:1px solid rgba(34,211,238,.2);}
.badge-soft{background:rgba(168,85,247,.1);color:#a855f7;border:1px solid rgba(168,85,247,.2);}
.badge-core{background:rgba(250,204,21,.1);color:#facc15;border:1px solid rgba(250,204,21,.2);}
.badge-combo{background:rgba(244,63,94,.1);color:#f43f5e;border:1px solid rgba(244,63,94,.2);}
.category-desc{font-size:13px;color:rgba(180,195,215,.55);margin-bottom:20px;max-width:600px;}

/* Filter */
.filter-bar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 24px 40px;max-width:800px;margin:0 auto;}
.filter-btn{padding:8px 18px;border-radius:100px;border:1px solid rgba(255,255,255,.1);background:transparent;color:rgba(180,195,215,.7);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;}
.filter-btn:hover,.filter-btn.active{background:rgba(34,211,238,.1);border-color:rgba(34,211,238,.3);color:#22d3ee;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:8px;}
.skill-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:20px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;}
.skill-card:hover{border-color:rgba(34,211,238,.2);transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.3);}
.skill-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--grade-color,#22d3ee),transparent);opacity:0;transition:opacity .25s;}
.skill-card:hover::before{opacity:1;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.card-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.12);}
.card-icon.soft{background:rgba(168,85,247,.08);border-color:rgba(168,85,247,.12);}
.card-grade{padding:3px 8px;border-radius:5px;font-size:9px;font-weight:800;letter-spacing:1px;}
.card-grade.s{background:rgba(250,204,21,.1);color:#facc15;border:1px solid rgba(250,204,21,.25);}
.card-grade.ss{background:rgba(251,146,60,.1);color:#fb923c;border:1px solid rgba(251,146,60,.25);}
.card-grade.sss{background:rgba(244,63,94,.1);color:#f43f5e;border:1px solid rgba(244,63,94,.25);}
.card-grade.a{background:rgba(34,211,238,.1);color:#22d3ee;border:1px solid rgba(34,211,238,.25);}
.card-grade.b{background:rgba(74,222,128,.1);color:#4ade80;border:1px solid rgba(74,222,128,.25);}
.skill-card h3{font-size:15px;font-weight:700;margin-bottom:5px;color:#e8edf5;}
.skill-card .desc{font-size:12px;color:rgba(180,195,215,.6);line-height:1.55;margin-bottom:12px;}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;}
.card-tag{padding:2px 7px;border-radius:4px;font-size:9px;font-weight:600;background:rgba(255,255,255,.04);color:rgba(180,195,215,.5);border:1px solid rgba(255,255,255,.06);}

/* Combo cards */
.combo-section{max-width:1100px;margin:0 auto;padding:0 24px 60px;}
.combo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
.combo-card{background:rgba(244,63,94,.03);border:1px solid rgba(244,63,94,.1);border-radius:14px;padding:20px;transition:all .25s;}
.combo-card:hover{border-color:rgba(244,63,94,.25);transform:translateY(-2px);}
.combo-card h3{font-size:15px;font-weight:700;margin-bottom:4px;color:#f43f5e;}
.combo-card .combo-for{font-size:11px;color:rgba(180,195,215,.5);margin-bottom:10px;}
.combo-skills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.combo-skill{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;background:rgba(255,255,255,.04);color:rgba(180,195,215,.7);border:1px solid rgba(255,255,255,.08);}
.combo-card .why{font-size:12px;color:rgba(180,195,215,.55);line-height:1.6;}

/* Modal */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:24px;opacity:0;transition:opacity .25s;}
.modal-overlay.open{display:flex;opacity:1;}
.modal{background:#141822;border:1px solid rgba(255,255,255,.08);border-radius:20px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto;position:relative;box-shadow:0 24px 80px rgba(0,0,0,.6);}
.modal-header{padding:28px 28px 0;position:relative;}
.modal-close{position:absolute;top:20px;right:20px;width:32px;height:32px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:rgba(180,195,215,.6);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.modal-close:hover{background:rgba(255,255,255,.08);color:#e8edf5;}
.modal-icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.12);margin-bottom:16px;}
.modal-meta{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
.modal h2{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:800;letter-spacing:-1px;margin-bottom:6px;}
.modal .subtitle{font-size:14px;color:rgba(180,195,215,.6);margin-bottom:20px;}
.modal-body{padding:0 28px 28px;}
.modal-section{margin-bottom:20px;}
.modal-section h4{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(34,211,238,.5);margin-bottom:10px;}
.modal-section p,.modal-section li{font-size:14px;color:rgba(180,195,215,.8);line-height:1.75;}
.modal-section ol{padding-left:20px;}
.modal-section ol li{margin-bottom:6px;}
.modal-section .highlight{background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.12);border-radius:10px;padding:16px;margin-top:10px;font-size:13px;color:rgba(180,195,215,.75);line-height:1.7;}
.modal-section .highlight strong{color:#22d3ee;}
.modal-flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 0;}
.modal-flow .step{padding:8px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:8px;font-size:13px;font-weight:600;color:rgba(180,195,215,.8);}
.modal-flow .arrow{color:rgba(34,211,238,.4);font-size:16px;}
.modal-suggestion{background:rgba(168,85,247,.06);border:1px solid rgba(168,85,247,.15);border-radius:10px;padding:14px;margin-top:12px;}
.modal-suggestion h5{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(168,85,247,.5);margin-bottom:8px;}
.modal-suggestion .suggest-items{display:flex;gap:6px;flex-wrap:wrap;}
.modal-suggestion .suggest-item{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;background:rgba(168,85,247,.08);color:#a855f7;border:1px solid rgba(168,85,247,.15);cursor:pointer;transition:all .2s;}
.modal-suggestion .suggest-item:hover{background:rgba(168,85,247,.15);}

.activate-section{margin-top:20px;padding-top:20px;border-top:1px solid rgba(255,255,255,.06);}
.activate-label{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(34,211,238,.5);margin-bottom:12px;}
.activate-input-row{display:flex;gap:8px;margin-bottom:10px;}
.activate-input{flex:1;padding:12px 16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#e8edf5;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;}
.activate-input::placeholder{color:rgba(180,195,215,.35);}
.activate-input:focus{border-color:rgba(34,211,238,.4);}
.activate-btn{padding:12px 20px;background:linear-gradient(135deg,#22d3ee,#2563eb);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s;}
.activate-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(34,211,238,.3);}
.activate-success{display:none;padding:12px 16px;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.2);border-radius:8px;font-size:13px;color:#22d3ee;text-align:center;margin-bottom:10px;animation:fadeIn .3s ease;}
.activate-create{display:block;width:100%;padding:12px;background:transparent;border:1px solid rgba(255,255,255,.12);color:rgba(180,195,215,.8);border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;transition:all .2s;}
.activate-create:hover{border-color:rgba(255,255,255,.25);color:#e8edf5;background:rgba(255,255,255,.03);}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:640px){
  nav{padding:12px 16px;}.nav-links{display:none;}.hero{padding:100px 16px 40px;}.category-section,.combo-section{padding-left:16px;padding-right:16px;}.modal{border-radius:16px;margin:12px;}.modal-header,.modal-body{padding-left:20px;padding-right:20px;}
}
</style>

<script>
const skills = [
  // === CORE ===
  { id:"session-memory", icon:"🧠", name:"Session Memory", grade:"S", gradeClass:"s", type:"core", subtitle:"Long-term memory for AI", desc:"Your AI remembers everything between conversations. No more amnesia.", category:"core", tags:["memory","core","essential"],
    how:`<p>Every agent has a tiny notebook called <strong>sessions.md</strong>. Three parts:</p><ol><li><strong>The Header</strong> — who you are, what you're doing, who you care about, mistakes to never repeat</li><li><strong>The Entries</strong> — after every conversation, write 3-5 lines: what you did, what you learned, what's next</li><li><strong>The Janitor</strong> — every night at 3AM, a script checks everyone's notebook</li></ol>`,
    flow:["Wake up","Read notebook","Know everything","Do the work","Write it down","Sleep"], rule:"If you built it, write it down. If you didn't write it down, it never happened.", why:"Before this, AI forgot everything between conversations. Now every session leaves a trail.", pairsWith:["Auto-Dispatch","Fleet Monitor","Pattern Reader"] },

  { id:"auto-dispatch", icon:"🧠", name:"Auto-Dispatch", grade:"A", gradeClass:"a", type:"core", subtitle:"Smart intent routing", desc:"Takes natural language, auto-selects the right skill to handle it.", category:"core", tags:["routing","auto","core"],
    how:`<ol><li><strong>Analyze intent</strong> — understand what the user actually wants</li><li><strong>Pick skill</strong> — auto-activate the best-matching skill</li><li><strong>Execute</strong> — run it, return the result</li></ol>`,
    flow:["Receive query","Analyze intent","Pick skill","Execute","Return result"], rule:"Never guess which skill. If unclear, ask.", why:"Users don't need to know which skill exists. Ask naturally, AI figures it out.", pairsWith:["Session Memory","Report Engine","Alert Engine"] },

  { id:"fleet-monitor", icon:"🛡️", name:"Fleet Monitor", grade:"A", gradeClass:"a", type:"core", subtitle:"Monitor your entire fleet", desc:"Track all AI agent health, detect issues, automatic alerts.", category:"core", tags:["monitoring","health","alerts"],
    how:`<ol><li><strong>Health check</strong> — gateway, soul, sessions every 6 hours</li><li><strong>Alerts</strong> — agent offline, memory bloat, config errors</li><li><strong>Predictions</strong> — analyze trends, predict failures before they happen</li></ol>`,
    flow:["Scan","Detect","Analyze","Alert","Fix"], rule:"Observe first, conclude later.", why:"Predictive, not reactive. Catch problems before your customers notice.", pairsWith:["Session Memory","Alert Engine","Report Engine"] },

  // === HARD SKILLS — Operations ===
  { id:"kitchen-ops", icon:"🍳", name:"Kitchen Ops", grade:"S", gradeClass:"s", type:"hard", subtitle:"AI head chef", desc:"Shift management, recipes, inventory, SOPs, incident reports.", category:"hard-ops", tags:["F&B","kitchen","shifts","recipes"],
    how:`<ol><li><strong>Shifts</strong> — auto-calculates clock-in/out, catches late arrivals</li><li><strong>Recipes</strong> — stores and retrieves all SOPs</li><li><strong>Inventory</strong> — tracks stock, logs to Google Sheets</li><li><strong>Incidents</strong> — logs, categorizes, reports</li></ol>`,
    flow:["Receive order","Check SOP","Execute","Log","Report"], rule:"Database is the only source of truth. Never fabricate names or guess numbers.", why:"Ask the AI one question, get the answer immediately. No phone calls.", pairsWith:["HR & Staff","Google Drive","Report Engine","Schedule Manager"] },

  { id:"bar-ops", icon:"🍹", name:"Bar Ops", grade:"S", gradeClass:"s", type:"hard", subtitle:"AI bar manager", desc:"Bar inventory, evening shifts, customer flow tracking, revenue.", category:"hard-ops", tags:["F&B","bar","inventory","evening"],
    how:`<ol><li><strong>Inventory</strong> — track ingredients, alert when low</li><li><strong>Evening shifts</strong> — staff check-in/out, auto-calculate hours</li><li><strong>Customers</strong> — track flow, peak hours</li><li><strong>Revenue</strong> — daily logging, trend analysis</li></ol>`,
    flow:["Open shift","Check-in","Monitor","Log","Close shift"], rule:"Financial data stays in the Finance group only.", why:"AI bar manager works every evening. Never forgets to log. Never plays favorites.", pairsWith:["Kitchen Ops","HR & Staff","Finance","Content Engine"] },

  { id:"hr-staff", icon:"👥", name:"HR & Staff", grade:"A", gradeClass:"a", type:"hard", subtitle:"Automated staff management", desc:"Attendance, EXP system, leaderboards, performance reviews, reports.", category:"hard-ops", tags:["HR","attendance","payroll","EXP"],
    how:`<ol><li><strong>Attendance</strong> — /checkin /checkout, auto-calculate hours</li><li><strong>EXP & Leaderboard</strong> — earn points through work, real-time rankings</li><li><strong>Reports</strong> — hours worked, late arrivals, performance — auto-sent</li></ol>`,
    flow:["Check-in","Work","Check-out","Earn EXP","Report"], rule:"Financial data stays in the Finance group only.", why:"Staff uses Telegram. Managers get automatic reports. No separate app.", pairsWith:["Schedule Manager","Alert Engine","Finance","Manager Dashboard"] },

  { id:"schedule-mgr", icon:"📅", name:"Schedule Manager", grade:"A", gradeClass:"a", type:"hard", subtitle:"Shift scheduling", desc:"Import schedules, approval workflow, Google Drive sync, attendance tracking.", category:"hard-ops", tags:["schedule","shifts","approval"],
    how:`<ol><li><strong>Import</strong> — schedules from images or text</li><li><strong>Approval</strong> — manager approval workflow</li><li><strong>Sync</strong> — Google Drive attendance sync</li></ol>`,
    flow:["Import","Assign","Approve","Sync","Notify"], rule:"Schedules require confirmation. Never auto-change.", why:"Automate scheduling — no mistakes, no forgotten shifts, no arguments.", pairsWith:["HR & Staff","Alert Engine","Google Drive"] },

  { id:"finance", icon:"💰", name:"Finance", grade:"A", gradeClass:"a", type:"hard", subtitle:"Accounting & Finance", desc:"Daily financial reports, revenue trends, expense analysis.", category:"hard-ops", tags:["accounting","revenue","expenses"],
    how:`<ol><li><strong>Reports</strong> — daily data entry, auto-aggregation</li><li><strong>Trends</strong> — week/month comparison, anomaly detection</li><li><strong>Analysis</strong> — cost vs revenue, margin, cash flow</li></ol>`,
    flow:["Input","Aggregate","Analyze","Compare","Report"], rule:"Numbers only from database. Never fabricate.", why:"Know your financial health every day — don't wait for month-end.", pairsWith:["Revenue Tracker","Report Engine","Anomaly Detection","Google Drive"] },

  { id:"revenue", icon:"📊", name:"Revenue Tracker", grade:"A", gradeClass:"a", type:"hard", subtitle:"Revenue tracking", desc:"Daily revenue input, anomaly detection, weekly/monthly rollups.", category:"hard-ops", tags:["revenue","tracking","anomaly"],
    how:`<ol><li><strong>Daily input</strong> — log revenue every day</li><li><strong>Anomaly</strong> — detect unusual fluctuations</li><li><strong>Rollup</strong> — weekly/monthly auto-aggregation</li></ol>`,
    flow:["Input","Check","Detect","Aggregate","Alert"], rule:"Every day must have input. Missing day = data gap.", why:"Know immediately how much you made today. Catch drops early.", pairsWith:["Finance","Anomaly Detection","Report Engine"] },

  { id:"anomaly", icon:"🚨", name:"Anomaly Detection", grade:"B", gradeClass:"b", type:"hard", subtitle:"Detect inconsistencies", desc:"Cross-reference operational data, find inconsistencies automatically.", category:"hard-ops", tags:["anomaly","alerts","data"],
    how:`<ol><li><strong>Cross-ref</strong> — compare attendance vs revenue vs inventory</li><li><strong>Pattern</strong> — detect unusual trends</li><li><strong>Alert</strong> — flag immediately when detected</li></ol>`,
    flow:["Collect","Compare","Detect","Analyze","Alert"], rule:"Flag first, conclude later. Show data, not guesses.", why:"Staff fraud, wrong numbers, fake attendance — AI sees everything.", pairsWith:["Revenue Tracker","HR & Staff","Finance","Alert Engine"] },

  { id:"alert-engine", icon:"🔔", name:"Alert Engine", grade:"A", gradeClass:"a", type:"hard", subtitle:"Proactive alert system", desc:"Detect incidents proactively, auto-notify, escalation patterns.", category:"hard-ops", tags:["alerts","proactive","notification"],
    how:`<ol><li><strong>Monitor</strong> — watch all data streams</li><li><strong>Detect</strong> — identify incidents by rules</li><li><strong>Notify</strong> — alert the right person at the right time</li></ol>`,
    flow:["Monitor","Detect","Classify","Notify","Escalate"], rule:"Alerts must be actionable. No noise.", why:"Incident at 2AM? AI alerts immediately. Doesn't wait until morning.", pairsWith:["Fleet Monitor","Anomaly Detection","Report Engine"] },

  { id:"report-engine", icon:"📋", name:"Report Engine", grade:"A", gradeClass:"a", type:"hard", subtitle:"Automated reports", desc:"Daily, weekly, monthly reports with health scoring.", category:"hard-ops", tags:["reports","automated","KPI"],
    how:`<ol><li><strong>Collect</strong> — gather data from all skills</li><li><strong>Aggregate</strong> — format reports by template</li><li><strong>Score</strong> — health score per department</li></ol>`,

// Render sections
const sections = document.getElementById('sections');
const categories = [
  { key:'core', label:'Core', badge:'badge-core', desc:'Foundation skills every agent needs.' },
  { key:'hard-ops', label:'Hard Skills — Operations', badge:'badge-hard', desc:'Run your business day-to-day.' },
  { key:'hard-tech', label:'Hard Skills — Technical', badge:'badge-hard', desc:'Code, deploy, integrate systems.' },
  { key:'hard-biz', label:'Hard Skills — Business', badge:'badge-hard', desc:'Marketing, finance, strategy.' },
  { key:'soft-companion', label:'Soft Skills — Companion', badge:'badge-soft', desc:'Connect, understand people, be present.' },
  { key:'soft-growth', label:'Soft Skills — Growth', badge:'badge-soft', desc:'Self-discovery, build foundations.' },
  { key:'soft-coaching', label:'Soft Skills — Coaching', badge:'badge-soft', desc:'Assess, plan, track commitments.' },
];

categories.forEach(cat => {
  const catSkills = skills.filter(s => s.category === cat.key);
  if (!catSkills.length) return;
  const sec = document.createElement('div');
  sec.className = 'category-section';
  sec.dataset.category = cat.key;
  sec.innerHTML = `
    <div class="category-header">
      <h2>${cat.label}</h2>
      <span class="category-badge ${cat.badge}">${catSkills.length} SKILLS</span>
    </div>
    <p class="category-desc">${cat.desc}</p>
    <div class="grid">${catSkills.map(s => `
      <div class="skill-card" data-id="${s.id}" data-category="${s.category}" style="--grade-color:${s.gradeClass==='s'?'#facc15':s.gradeClass==='ss'?'#fb923c':s.gradeClass==='sss'?'#f43f5e':s.gradeClass==='b'?'#4ade80':'#22d3ee'}">
        <div class="card-top">
          <div class="card-icon ${s.type==='soft'?'soft':''}">${s.icon}</div>
          <span class="card-grade ${s.gradeClass}">${s.grade}</span>
        </div>
        <h3>${s.name}</h3>
        <p class="desc">${s.desc}</p>
        <div class="card-tags">${s.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}</div>
      </div>
    `).join('')}</div>
  `;
  sections.appendChild(sec);
});

// Combo section

  <p class="category-desc">Skill sets that have been tested and work great together.</p>
  <div class="combo-grid">${combos.map(c => `
    <div class="combo-card">
      <h3>${c.name}</h3>
      <p class="combo-for">${c.forText}</p>
      <div class="combo-skills">${c.skills.map(s => `<span class="combo-skill">${s}</span>`).join('')}</div>
      <p class="why">${c.why}</p>
    </div>
  `).join('')}</div>
`;
sections.appendChild(comboSec);

// Click handlers
document.querySelectorAll('.skill-card').forEach(card => {
  card.addEventListener('click', () => {
    const s = skills.find(sk => sk.id === card.dataset.id);
    if (s) openModal(s);
  });
});

// Filter
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.filter;
    document.querySelectorAll('.category-section').forEach(sec => {
      sec.style.display = (f === 'all' || sec.dataset.category === f) ? '' : 'none';
    });
    document.querySelector('.combo-section').style.display = f === 'all' ? '' : 'none';
  });
});

// Modal
const overlay = document.getElementById('modal-overlay');
function openModal(s) {
  document.getElementById('modal-icon').textContent = s.icon;
  document.getElementById('modal-meta').innerHTML = `
    <span class="card-grade ${s.gradeClass}">${s.grade}</span>
    <span class="category-badge ${s.type==='soft'?'badge-soft':'badge-hard'}" style="font-size:9px;">${s.type==='soft'?'SOFT SKILL':'HARD SKILL'}</span>
  `;
  document.getElementById('modal-title').textContent = s.name;
  document.getElementById('modal-subtitle').textContent = s.subtitle;
  
  document.getElementById('modal-body').innerHTML = `
    <div class="modal-section"><h4>How It Works</h4>${s.how}</div>
    <div class="modal-section"><h4>The Flow</h4>
      <div class="modal-flow">${s.flow.map((step, i) => `<span class="step">${step}</span>${i < s.flow.length - 1 ? '<span class="arrow">→</span>' : ''}`).join('')}</div>
    </div>
    <div class="modal-section"><h4>Why It Works</h4><p>${s.why}</p></div>
    <div class="modal-section"><div class="highlight"><strong>The Rule:</strong> ${s.rule}</div></div>
    ${s.pairsWith ? `<div class="modal-suggestion"><h5>🔗 Pairs well with</h5><div class="suggest-items">${s.pairsWith.map(p => `<span class="suggest-item">${p}</span>`).join('')}</div></div>` : ''}
    <div class="activate-section">
      <div class="activate-label">Activate Skill</div>
      <div class="activate-success" id="activate-success-${s.id}">✅ Saved! <strong>${s.name}</strong> will be activated for your Agent.</div>
      <div class="activate-input-row" id="activate-row-${s.id}">
        <input type="text" class="activate-input" id="agent-id-${s.id}" placeholder="Enter your Agent ID..." />
        <button class="activate-btn" onclick="activateSkill('${s.id}', '${s.name}')">Activate →</button>
      </div>
      <a href="https://www.myclaw.vn/en/pricing?utm_source=noobslearnai&utm_medium=library&utm_campaign=skill_${s.id}" class="activate-create">🚀 Create Your Own Agent →</a>
    </div>
  `;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function activateSkill(skillId, skillName) {
  const input = document.getElementById('agent-id-' + skillId);
  const agentId = input.value.trim();
  if (!agentId) { input.focus(); input.style.borderColor = '#f43f5e'; setTimeout(() => input.style.borderColor = '', 1500); return; }
  const activations = JSON.parse(localStorage.getItem('skill_activations') || '[]');
  activations.push({ skillId, skillName, agentId, timestamp: new Date().toISOString() });
  localStorage.setItem('skill_activations', JSON.stringify(activations));
  document.getElementById('activate-success-' + skillId).style.display = 'block';
  document.getElementById('activate-row-' + skillId).style.display = 'none';
}

document.getElementById('modal-close').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function closeModal() { overlay.classList.remove('open'); document.body.style.overflow = ''; }
</script>
