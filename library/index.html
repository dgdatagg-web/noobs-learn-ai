<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Skill Library | Agent Skills Marketplace | NoobsLearnAI</title>
<meta name="description" content="Browse AI agent skills — Session Memory, Kitchen Ops, HR, Companion, Code Builder. Pick the skills your AI agent needs. No code required.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--black:#12121a;--dark:#171720;--card:#1e1e2a;--border:#2e2e3d;--accent:#00bfa5;--accent2:#00d4b8;--white:#eaeaf0;--gray:#8888a4;--light:#b0b0c8;}
body{background:var(--black);background-image:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.03) 0%,transparent 40%),radial-gradient(ellipse at 75% 40%,rgba(0,191,165,.06) 0%,transparent 35%);color:var(--white);font-family:'Inter',sans-serif;font-size:16px;line-height:1.6;overflow-x:hidden;min-height:100vh;}

/* Nav */
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:16px 32px;display:flex;justify-content:space-between;align-items:center;background:rgba(15,15,19,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);box-shadow:0 1px 8px rgba(0,0,0,.3);}
.nav-logo{font-weight:900;font-size:18px;letter-spacing:-.5px;color:var(--white);text-decoration:none;}
.nav-logo span{color:var(--accent);}
.nav-links{display:flex;gap:24px;align-items:center;}
.nav-links a{font-size:13px;color:var(--gray);text-decoration:none;font-weight:500;transition:color .2s;}
.nav-links a:hover{color:var(--white);}
.nav-cta{background:var(--accent);color:white;border:none;padding:10px 22px;border-radius:6px;font-weight:700;font-size:14px;text-decoration:none;transition:background .2s;}
.nav-cta:hover{background:var(--accent2);}

/* Hero */
.hero{padding:120px 24px 60px;text-align:center;}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;background:rgba(0,191,165,.07);border:1px solid rgba(0,191,165,.2);border-radius:100px;font-size:12px;font-weight:600;color:var(--accent);margin-bottom:24px;}
.hero h1{font-size:clamp(28px,5vw,48px);font-weight:900;letter-spacing:-2px;line-height:1.1;margin-bottom:16px;}
.hero h1 span{color:var(--accent);}
.hero p{font-size:16px;color:var(--gray);max-width:560px;margin:0 auto;line-height:1.7;}

/* Filter */
.filter-bar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 24px 40px;max-width:700px;margin:0 auto;}
.filter-btn{padding:8px 18px;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--gray);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;}
.filter-btn:hover,.filter-btn.active{background:rgba(0,191,165,.1);border-color:rgba(0,191,165,.3);color:var(--accent);}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;max-width:1100px;margin:0 auto;padding:0 24px 80px;}

/* Skill Card */
.skill-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;}
.skill-card:hover{border-color:rgba(0,191,165,.25);transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.4);}
.skill-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--grade-color,var(--accent)),transparent);opacity:0;transition:opacity .25s;}
.skill-card:hover::before{opacity:1;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.card-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(0,191,165,.08);border:1px solid rgba(0,191,165,.15);}
.card-grade{padding:4px 10px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:1px;}
.card-grade.s{background:rgba(250,204,21,.1);color:#facc15;border:1px solid rgba(250,204,21,.25);}
.card-grade.ss{background:rgba(251,146,60,.1);color:#fb923c;border:1px solid rgba(251,146,60,.25);}
.card-grade.sss{background:rgba(244,63,94,.1);color:#f43f5e;border:1px solid rgba(244,63,94,.25);}
.card-grade.a{background:rgba(0,191,165,.1);color:var(--accent);border:1px solid rgba(0,191,165,.25);}
.skill-card h3{font-size:16px;font-weight:700;margin-bottom:6px;}
.skill-card .desc{font-size:13px;color:var(--gray);line-height:1.6;margin-bottom:14px;}
.card-tags{display:flex;gap:6px;flex-wrap:wrap;}
.card-tag{padding:3px 8px;border-radius:4px;font-size:10px;font-weight:600;background:rgba(255,255,255,.04);color:var(--gray);border:1px solid var(--border);}

/* Modal */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:24px;opacity:0;transition:opacity .25s;}
.modal-overlay.open{display:flex;opacity:1;}
.modal{background:var(--dark);border:1px solid var(--border);border-radius:20px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto;position:relative;box-shadow:0 24px 80px rgba(0,0,0,.6);}
.modal-header{padding:28px 28px 0;position:relative;}
.modal-close{position:absolute;top:20px;right:20px;width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--gray);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.modal-close:hover{background:rgba(255,255,255,.08);color:var(--white);}
.modal-icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;background:rgba(0,191,165,.08);border:1px solid rgba(0,191,165,.15);margin-bottom:16px;}
.modal-meta{display:flex;gap:10px;align-items:center;margin-bottom:8px;}
.modal h2{font-size:24px;font-weight:900;letter-spacing:-1px;margin-bottom:6px;}
.modal .subtitle{font-size:14px;color:var(--gray);margin-bottom:20px;}
.modal-body{padding:0 28px 28px;}
.modal-section{margin-bottom:20px;}
.modal-section h4{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(0,191,165,.5);margin-bottom:10px;}
.modal-section p,.modal-section li{font-size:14px;color:var(--light);line-height:1.75;}
.modal-section ol{padding-left:20px;}
.modal-section ol li{margin-bottom:6px;}
.modal-section .highlight{background:rgba(0,191,165,.06);border:1px solid rgba(0,191,165,.15);border-radius:10px;padding:16px;margin-top:10px;font-size:13px;color:var(--light);line-height:1.7;}
.modal-section .highlight strong{color:var(--accent);}
.modal-flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 0;}
.modal-flow .step{padding:8px 14px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;font-size:13px;font-weight:600;color:var(--light);}
.modal-flow .arrow{color:rgba(0,191,165,.4);font-size:16px;}
.modal-cta{display:block;width:100%;padding:14px;background:var(--accent);color:white;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;transition:all .2s;margin-top:8px;}
.modal-cta:hover{background:var(--accent2);transform:translateY(-1px);}

/* Activation Flow */
.activate-section{margin-top:20px;padding-top:20px;border-top:1px solid var(--border);}
.activate-label{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(0,191,165,.5);margin-bottom:12px;}
.activate-input-row{display:flex;gap:8px;margin-bottom:10px;}
.activate-input{flex:1;padding:12px 16px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;color:var(--white);font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;}
.activate-input::placeholder{color:rgba(136,136,164,.4);}
.activate-input:focus{border-color:rgba(0,191,165,.4);}
.activate-btn{padding:12px 20px;background:var(--accent);color:white;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s;}
.activate-btn:hover{background:var(--accent2);transform:translateY(-1px);}
.activate-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.activate-success{display:none;padding:12px 16px;background:rgba(0,191,165,.08);border:1px solid rgba(0,191,165,.2);border-radius:8px;font-size:13px;color:var(--accent);text-align:center;margin-bottom:10px;animation:fadeIn .3s ease;}
.activate-divider{display:flex;align-items:center;gap:12px;margin:14px 0;color:var(--gray);font-size:12px;}
.activate-divider::before,.activate-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.activate-create{display:block;width:100%;padding:12px;background:transparent;border:1px solid var(--border);color:var(--light);border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;transition:all .2s;}
.activate-create:hover{border-color:rgba(255,255,255,.2);color:var(--white);background:rgba(255,255,255,.03);}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}

@media(max-width:640px){
  nav{padding:12px 16px;}
  .nav-links{display:none;}
  .hero{padding:100px 16px 40px;}
  .grid{padding:0 16px 60px;}
  .modal{border-radius:16px;margin:12px;}
  .modal-header,.modal-body{padding-left:20px;padding-right:20px;}
}
</style>
</head>

const grid = document.getElementById('skill-grid');
skills.forEach(s => {
  const card = document.createElement('div');
  card.className = 'skill-card';
  card.dataset.category = s.category;
  card.dataset.id = s.id;
  card.style.setProperty('--grade-color', 
    s.gradeClass === 's' ? '#facc15' : 
    s.gradeClass === 'ss' ? '#fb923c' : 
    s.gradeClass === 'sss' ? '#f43f5e' : 'var(--accent)');
  card.innerHTML = `
    <div class="card-top">
      <div class="card-icon">${s.icon}</div>
      <span class="card-grade ${s.gradeClass}">${s.grade}</span>
    </div>
    <h3>${s.name}</h3>
    <p class="desc">${s.desc}</p>
    <div class="card-tags">${s.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}</div>

});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.filter;
    document.querySelectorAll('.skill-card').forEach(card => {
      card.style.display = (f === 'all' || card.dataset.category === f) ? '' : 'none';
    });
  });
});

const overlay = document.getElementById('modal-overlay');
function openModal(s) {
  document.getElementById('modal-icon').textContent = s.icon;
  document.getElementById('modal-grade').textContent = s.grade;
  document.getElementById('modal-grade').className = `card-grade ${s.gradeClass}`;
  document.getElementById('modal-title').textContent = s.name;
  document.getElementById('modal-subtitle').textContent = s.subtitle;
  
  document.getElementById('modal-body').innerHTML = `
    <div class="modal-section">
      <h4>How It Works</h4>
      ${s.how}
    </div>
    <div class="modal-section">
      <h4>The Flow</h4>
      <div class="modal-flow">
        ${s.flow.map((step, i) => 
          `<span class="step">${step}</span>${i < s.flow.length - 1 ? '<span class="arrow">→</span>' : ''}`
        ).join('')}
      </div>
    </div>
    <div class="modal-section">
      <h4>Why It Works</h4>
      <p>${s.why}</p>
    </div>
    <div class="modal-section">
      <div class="highlight">
        <strong>The one rule:</strong> ${s.rule}
      </div>
    </div>
    <div class="activate-section">
      <div class="activate-label">Activate Skill</div>
      <div class="activate-success" id="activate-success-${s.id}">✅ Saved! <strong>${s.name}</strong> will be activated for your Agent.</div>
      <div class="activate-input-row" id="activate-row-${s.id}">
        <input type="text" class="activate-input" id="agent-id-${s.id}" placeholder="Enter your Agent ID..." />
        <button class="activate-btn" onclick="activateSkill('${s.id}', '${s.name}')">Activate →</button>
      </div>
      <div class="activate-divider">if you don't have one yet, get one here</div>
      <a href="https://www.myclaw.vn/en/pricing?utm_source=noobslearnai&utm_medium=library&utm_campaign=skill_${s.id}" class="activate-create">🚀 Create Your Own Agent →</a>
    </div>
  `;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function activateSkill(skillId, skillName) {
  const input = document.getElementById('agent-id-' + skillId);
  const agentId = input.value.trim();
  if (!agentId) { input.focus(); input.style.borderColor = '#f43f5e'; setTimeout(() => input.style.borderColor = '', 1500); return; }
  
  const activations = JSON.parse(localStorage.getItem('skill_activations') || '[]');
  activations.push({ skillId, skillName, agentId, timestamp: new Date().toISOString() });
  localStorage.setItem('skill_activations', JSON.stringify(activations));
  
  const successEl = document.getElementById('activate-success-' + skillId);
  const rowEl = document.getElementById('activate-row-' + skillId);
  successEl.style.display = 'block';
  rowEl.style.display = 'none';
}

document.getElementById('modal-close').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function closeModal() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}
</script>
</body>
</html>
